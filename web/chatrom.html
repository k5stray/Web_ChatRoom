<!DOCTYPE html>
<html lang="en">
<head>
    <title id="title">ChatRoom</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", "PingFang SC", "Helvetica Neue", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 20px;
        }
        .dataDiv {
            width: 100%;
            max-width: 800px;
            height: 80vh;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .topDiv {
            height: 60px;
            background-color: #f0f7ff;
            color: #409eff;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .line {
            height: 1px;
            background-color: #e5e6eb;
        }
        .bodyDiv {
            height: calc(100% - 60px);
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #f9f9f9;
            scrollbar-width: thin;
            scrollbar-color: #dcdfe6 #f5f5f5;
        }
        .content::-webkit-scrollbar {
            width: 6px;
        }
        .content::-webkit-scrollbar-thumb {
            border-radius: 3px;
            background-color: #dcdfe6;
        }
        .content::-webkit-scrollbar-track {
            background-color: #f5f5f5;
        }
        .sysmessage {
            text-align: center;
            color: #909399;
            font-size: 12px;
            margin-bottom: 10px;
            padding: 5px 0;
        }
        .leftDiv {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .left-info {
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #909399;
        }
        .left-info .time {
            margin-right: 8px;
        }
        /* .right-info .nickname {
            color: #04070c;
            font-size: 15px;
        } */
        .leftContent {
            min-width: 80px;
            max-width: 70%;
            padding: 10px 15px;
            background-color: #fff;
            border-radius: 8px 8px 8px 0;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            color: #303133;
            line-height: 1.5;
            word-wrap: break-word;
            text-align: left;
        }
        .rightDiv {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .right-info {
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #909399;
        }
        .right-info .nickname {
            margin-right: 8px;
            /* color: #04070c;
            font-size: 15px; */
        }
        .rightContent {
            min-width: 80px;
            max-width: 70%;
            padding: 10px 15px;
            background-color: #409eff;
            border-radius: 8px 8px 0 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            color: #fff;
            line-height: 1.5;
            word-wrap: break-word;
            text-align: left;
        }
        .chat-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 6px;
            object-fit: cover;
            cursor: pointer;
        }
        .input {
            padding: 8px;
        }
        .bottomDiv {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .text {
            flex: 1;
            height: 80px;
            padding: 10px 15px;
            border: 1px solid #e5e6eb;
            border-radius: 8px;
            resize: none;
            outline: none;
            font-size: 14px;
            color: #303133;
            line-height: 1.5;
        }
        .text:focus {
            border-color: #409eff;
            box-shadow: 0 0 0 2px rgba(64, 158, 255, 0.2);
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .commit {
            width: 80px;
            height: 37px;
            background-color: #409eff;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .commit:hover {
            background-color: #66b1ff;
        }
        .commit:active {
            background-color: #3399ff;
        }
        #imgFile {
            display: none;
        }
        .img-btn {
            width: 80px;
            height: 37px;
            background-color: #67c23a;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .img-btn:hover {
            background-color: #85ce61;
        }
    </style>
</head>
<body>
    <div class="dataDiv">
        <div class="topDiv" id="contenthead">聊天室（支持发送图片）</div>
        <div class="line"></div>
        <div class="bodyDiv">
            <div class="content" id="content">
                <div id="next"></div>
            </div>
            <div class="input" id="input">
                <div id="fileMessage"></div>
                <div class="line"></div>
                <div class="bottomDiv">
                    <textarea id="message" class="text" placeholder="请输入文字，也可发送图片"></textarea>
                    <div class="btn-group">
                        <button class="img-btn" onclick="document.getElementById('imgFile').click()">选择图片</button>
                        <button onclick="sendWebsocket()" class="commit">发送</button>
                    </div>
                    <input type="file" id="imgFile" accept="image/*">
                </div>
            </div>
        </div>
    </div>
    <script>
        let imgHtml =
    `<div class="${g_class.total}">
        <div class="${g_class.info}">`
            + info0 + info1 +
        `</div>`;
    </script>
</body>
</html>
